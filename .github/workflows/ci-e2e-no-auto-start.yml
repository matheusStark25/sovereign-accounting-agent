name: CI - E2E without auto-start

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-no-auto-start:
    runs-on: ubuntu-latest
    env:
      E2E_AUTO_START: '0'
      ENVIRONMENT: 'test'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt || true
      - name: Run tests (no auto-start)
        run: |
          pytest -q
