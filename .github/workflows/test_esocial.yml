name: Test EsocialBaixaTool

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test-esocial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Chrome, ChromeDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Create extensions directory
        run: |
          mkdir -p extensions

      - name: Download Buster extension
        run: |
          echo "[INFO] Downloading Buster extension (reCAPTCHA solver)..."
          # Buster is available on Chrome Web Store, but for CI we'll use a prebuilt CRX
          # If you have a custom CRX file in your repo, place it in extensions/
          # Otherwise, skip this step or use a mock extension
          if [ ! -f "extensions/buster.crx" ]; then
            echo "[INFO] Buster CRX not in repo, will run test without it (fallback mode)"
            touch extensions/buster_placeholder.txt
          else
            echo "[OK] Buster CRX found"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install core dependencies from project
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          # Install additional CI dependencies
          pip install selenium undetected-chromedriver aiohttp pydantic pdfplumber

      - name: List installed packages
        run: |
          pip list | grep -E "(selenium|playwright|chrome|pydantic|aiohttp)"

      - name: Run EsocialBaixaTool CI test
        run: |
          python test_esocial_ci.py
        env:
          CI: true
          DISPLAY: :99
          HEADLESS: "false"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            test_results_esocial.json
          if-no-files-found: ignore

      - name: Report test status
        if: always()
        run: |
          echo "Test completed on Python ${{ matrix.python-version }}"
          if [ -f "test_results_esocial.json" ]; then
            echo "Test results found, analyzing..."
            cat test_results_esocial.json || echo "Could not read test results"
          fi
