name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Instalar o Chromium do Playwright (testes do RPA e do front-end)
        run: playwright install --with-deps chromium
      - name: Lint (erros reais e imports sem uso)
        run: flake8 agente_v2 contabil_agente --select=E9,F63,F7,F82,F401,F811,F841,F541
      - name: Testes
        run: pytest

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditoria de dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem (sem publicar)
        run: docker build -t sovereign-accounting-agent:ci .
      - name: A imagem sobe e responde ao /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET=ci-segredo-de-teste-com-mais-de-32-caracteres-0000 \
            -e AUDIT_HMAC_KEY=ci-hmac-de-teste-com-mais-de-32-caracteres-0000 \
            -e GOVERNANCA_DSA_KEY="$(docker run --rm sovereign-accounting-agent:ci python -m agente_v2.cli gerar-chave-governanca | tail -1 | cut -d= -f2-)" \
            sovereign-accounting-agent:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api
          exit 1
