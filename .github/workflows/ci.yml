name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Instalar o Chromium do Playwright (testes do RPA e do front-end)
        run: playwright install --with-deps chromium
      - name: Lint (erros reais e imports sem uso)
        run: flake8 agente_v2 contabil_agente --select=E9,F63,F7,F82,F401,F811,F841,F541
      - name: Testes
        run: |
          set -o pipefail
          pytest --tb=short -rf 2>&1 | tee pytest.log
      - name: Erro do pytest como anotação (visível na página da execução, sem login)
        if: failure()
        run: |
          corpo=$(tail -n 60 pytest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest falhou::${corpo}"
          { echo '### Resultado do pytest'; echo '```'; tail -n 120 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditoria de dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem (sem publicar)
        run: docker build -t sovereign-accounting-agent:ci .
      - name: A imagem sobe e responde ao /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET=ci-segredo-de-teste-com-mais-de-32-caracteres-0000 \
            -e AUDIT_HMAC_KEY=ci-hmac-de-teste-com-mais-de-32-caracteres-0000 \
            -e GOVERNANCA_DSA_KEY="$(docker run --rm sovereign-accounting-agent:ci python -m agente_v2.cli gerar-chave-governanca | tail -1 | cut -d= -f2-)" \
            sovereign-accounting-agent:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api
          exit 1

  pilha:
    # Sobe a pilha inteira do docker-compose (API, worker, Redis com senha e nginx com TLS e mTLS) e confere o que o README promete.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Gerar segredos e certificados de teste
        run: |
          pip install -r requirements.txt
          S() { python -m agente_v2.cli gerar-segredo; }
          {
            echo "JWT_SECRET=$(S)"
            echo "AUDIT_HMAC_KEY=$(S)"
            echo "REDIS_PASSWORD=$(S)"
            echo "GOVERNANCA_DSA_KEY='$(python -m agente_v2.cli gerar-chave-governanca | tail -1 | cut -d= -f2-)'"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=Aa1-$(S)"
            echo "ADMIN_TENANT=ci"
          } > .env
          python -c "from agente_v2.mtls import emitir_certificados_dev as e; e('certs')"
      - name: Subir a pilha (API, worker, Redis, nginx)
        run: |
          set -o pipefail
          docker compose --profile gateway up -d --build 2>&1 | tee compose.log
      - name: A API responde pelo gateway (TLS) e as métricas não ficam públicas
        run: |
          ok=0
          for i in $(seq 1 40); do curl -fsS --cacert certs/ca.pem https://localhost/health && ok=1 && break; sleep 3; done
          [ "$ok" = 1 ] || { docker compose logs; exit 1; }
          test "$(curl -s --cacert certs/ca.pem -o /dev/null -w '%{http_code}' https://localhost/metrics)" = 404
      - name: A porta de serviços exige certificado de cliente (mTLS)
        run: |
          if curl -fsS --cacert certs/ca.pem https://localhost:8443/health; then echo "ERRO: a porta 8443 aceitou conexão sem certificado de cliente"; exit 1; fi
          curl -fsS --cacert certs/ca.pem --cert certs/cliente.pem --key certs/cliente.key https://localhost:8443/health
      - name: Login e uma rota protegida funcionam pelo gateway
        run: |
          set -a; . ./.env; set +a
          TOKEN=$(curl -fsS --cacert certs/ca.pem -d "username=admin&password=${ADMIN_PASSWORD}" https://localhost/token | python -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          test "$(curl -s --cacert certs/ca.pem -o /dev/null -w '%{http_code}' https://localhost/users/me)" = 401
          curl -fsS --cacert certs/ca.pem -H "Authorization: Bearer ${TOKEN}" https://localhost/users/me
      - name: O worker de documentos fala com o Redis
        run: docker compose exec -T worker-documentos celery -A contabil_agente.tarefas inspect ping --timeout 15
      - name: Erro como anotação pública (se algo falhou)
        if: failure()
        run: |
          { tail -n 40 compose.log 2>/dev/null; echo '--- logs dos contêineres ---'; docker compose logs --no-color --tail 40 2>&1; } > falha.txt || true
          corpo=$(tail -n 70 falha.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pilha falhou::${corpo}"

  observabilidade:
    # Sobe API + Prometheus + Alertmanager + Grafana e confere de verdade: alvo no ar, métrica real depois de usar a API, painel e fonte
    # de dados carregados no Grafana, regras sem erro e um alerta disparando de ponta a ponta (derruba a API e espera chegar ao Alertmanager).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Validar a configuração do Prometheus com a ferramenta oficial (promtool)
        run: |
          docker run --rm \
            -v "$PWD/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
      - name: Gerar segredos de teste
        run: |
          pip install -r requirements.txt
          S() { python -m agente_v2.cli gerar-segredo; }
          {
            echo "JWT_SECRET=$(S)"
            echo "AUDIT_HMAC_KEY=$(S)"
            echo "REDIS_PASSWORD=$(S)"
            echo "GOVERNANCA_DSA_KEY='$(python -m agente_v2.cli gerar-chave-governanca | tail -1 | cut -d= -f2-)'"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=Aa1-$(S)"
            echo "ADMIN_TENANT=ci"
            echo "GRAFANA_ADMIN_PASSWORD=$(S)"
          } > .env
      - name: O Grafana se recusa a subir sem senha e o Alertmanager recusa webhook sem HTTPS
        run: |
          if docker compose run --rm --no-deps -e GF_SECURITY_ADMIN_PASSWORD= grafana; then echo "ERRO: o Grafana subiu sem senha"; exit 1; fi
          if docker compose run --rm --no-deps -e ALERTA_WEBHOOK_URL=http://exemplo.local/hook alertmanager; then echo "ERRO: o Alertmanager aceitou webhook sem HTTPS"; exit 1; fi
      - name: Subir a API e a observabilidade
        run: |
          set -o pipefail
          docker compose --profile observabilidade up -d --build 2>&1 | tee compose.log
      - name: O Prometheus enxerga a API e carrega todas as regras sem erro
        run: |
          ok=0
          for i in $(seq 1 40); do
            v=$(curl -fsS --get 'http://127.0.0.1:9090/api/v1/query' --data-urlencode 'query=up{job="api"}' | python -c "import sys,json; r=json.load(sys.stdin)['data']['result']; print(r[0]['value'][1] if r else 0)" 2>/dev/null || echo 0)
            [ "$v" = 1 ] && ok=1 && break; sleep 3
          done
          [ "$ok" = 1 ] || { docker compose logs prometheus api; exit 1; }
          curl -fsS http://127.0.0.1:9090/api/v1/rules | python -c "import sys,json; regras=[x for g in json.load(sys.stdin)['data']['groups'] for x in g['rules']]; assert len(regras) >= 6 and all(x['health'] == 'ok' for x in regras), regras; print(len(regras), 'regras ok')"
      - name: Métrica de verdade aparece depois de usar a API
        run: |
          set -a; . ./.env; set +a
          TOKEN=$(curl -fsS -d "username=admin&password=${ADMIN_PASSWORD}" http://127.0.0.1:8000/token | python -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d '{"salario":3000,"competencia":"2026-09"}' http://127.0.0.1:8000/api/v1/calculo/inss > /dev/null
          v=0
          for i in $(seq 1 30); do
            v=$(curl -fsS --get 'http://127.0.0.1:9090/api/v1/query' --data-urlencode 'query=sum(agente_calculos_total{tipo="inss",resultado="ok"})' | python -c "import sys,json; r=json.load(sys.stdin)['data']['result']; print(int(float(r[0]['value'][1])) if r else 0)")
            [ "$v" -ge 1 ] && break; sleep 3
          done
          [ "$v" -ge 1 ] || { echo "A métrica agente_calculos_total não chegou ao Prometheus"; exit 1; }
      - name: O Grafana sobe com o painel e a fonte de dados, fala com o Prometheus e exige login
        run: |
          set -a; . ./.env; set +a
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1 && break; sleep 3; done
          curl -fsS -u "admin:${GRAFANA_ADMIN_PASSWORD}" 'http://127.0.0.1:3000/api/search?query=Sovereign' | python -c "import sys,json; r=json.load(sys.stdin); assert any(d['uid'] == 'sovereign-agente' for d in r), r"
          curl -fsS -u "admin:${GRAFANA_ADMIN_PASSWORD}" http://127.0.0.1:3000/api/datasources/uid/prometheus/health | python -c "import sys,json; r=json.load(sys.stdin); assert r['status'] == 'OK', r"
          curl -fsS -u "admin:${GRAFANA_ADMIN_PASSWORD}" --get 'http://127.0.0.1:3000/api/datasources/proxy/uid/prometheus/api/v1/query' --data-urlencode 'query=up{job="api"}' | python -c "import sys,json; r=json.load(sys.stdin)['data']['result']; assert r and r[0]['value'][1] == '1', r"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/search)" = 401
      - name: Um alerta de verdade chega ao Alertmanager (derruba a API)
        run: |
          curl -fsS http://127.0.0.1:9093/-/ready
          docker compose stop api
          ok=0
          for i in $(seq 1 60); do
            n=$(curl -fsS http://127.0.0.1:9093/api/v2/alerts | python -c "import sys,json; print(sum(1 for a in json.load(sys.stdin) if a['labels']['alertname'] == 'ApiForaDoAr' and a['status']['state'] == 'active'))")
            [ "$n" -ge 1 ] && ok=1 && break; sleep 5
          done
          [ "$ok" = 1 ] || { curl -s http://127.0.0.1:9090/api/v1/alerts; docker compose logs prometheus alertmanager; exit 1; }
      - name: Erro como anotação pública (se algo falhou)
        if: failure()
        run: |
          { tail -n 40 compose.log 2>/dev/null; echo '--- logs dos contêineres ---'; docker compose logs --no-color --tail 40 2>&1; } > falha.txt || true
          corpo=$(tail -n 70 falha.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=observabilidade falhou::${corpo}"
