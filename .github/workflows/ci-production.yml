name: CI Production Build

on:
  push:
    branches: [ main ]

jobs:
  prod-check:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure secret GROQ_API_KEY is configured
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then echo "GROQ_API_KEY not set; please configure repository secret GROQ_API_KEY"; exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_new.txt ]; then pip install -r requirements_new.txt; fi

      - name: Run backend tests
        run: |
          pytest -q

      - name: Build production Docker image (Dockerfile.production)
        run: |
          docker build -f Dockerfile.production -t agente-contabil:prod .
