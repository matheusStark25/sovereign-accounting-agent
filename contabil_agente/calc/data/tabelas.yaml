# FONTE UNICA das tabelas de INSS e IRRF (nenhum outro arquivo repete estes valores).
# Ao publicar nova portaria/lei: acrescente um registro com vigencia propria e feche a vigencia do anterior.
# O motor NUNCA reajusta valores sozinho: competencia sem tabela gera erro explicito.
# Valores monetarios e aliquotas ficam entre aspas (texto) para nao virarem ponto flutuante.
schema_version: 1
