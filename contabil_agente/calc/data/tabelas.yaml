como_atualizar: 'Ao publicar nova portaria/lei, acrescente um novo registro com vigencia propria e feche a vigencia do anterior. O motor NUNCA
  reajusta valores sozinho: competencia sem tabela gera erro explicito.'
niveis_de_verificacao:
  primaria: valores lidos no texto da lei publicada no site oficial (Planalto)
  gov_br: valores confirmados em paginas oficiais do gov.br (Previdencia, INSS, eSocial, Receita/Fazenda) e consistentes por aritmetica; texto
    integral da portaria nao foi aberto
  conferir: valores conhecidos e consistentes por aritmetica, sem fonte oficial aberta nesta revisao; conferir antes de uso em producao
