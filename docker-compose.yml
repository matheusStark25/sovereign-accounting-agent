# Pilha de execução: API, worker de documentos, Redis, Vault (só desenvolvimento) e gateway nginx com TLS e mTLS.
#
#   cp .env.example .env        # preencha os segredos: o compose se recusa a subir sem eles
#   docker compose up --build   # API em http://localhost:8000
#   docker compose --profile gateway up --build    # + nginx: https://localhost (usuários) e https://localhost:8443 (mTLS)
#   docker compose --profile dev up --build        # + Vault em modo desenvolvimento
#   docker compose --profile observabilidade up -d # + Prometheus, Alertmanager e Grafana (http://127.0.0.1:3000, só na própria máquina)
#
# O worker do RPA do FGTS (navegador com captcha/login feito por uma pessoa) NÃO está aqui: veja o README.

x-api: &api
  build: .
  image: sovereign-accounting-agent:local
  env_file: .env
  environment: &api-env
    AGENTE_ENV: production
    DATA_DIR: /data
    AUTH_DB_PATH: /data/auth.db
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379/0
    JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?defina AUDIT_HMAC_KEY no .env}
    GOVERNANCA_DSA_KEY: ${GOVERNANCA_DSA_KEY:?defina GOVERNANCA_DSA_KEY no .env}
  volumes:
    - dados:/data
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  api:
    <<: *api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker-documentos:
    <<: *api
    command: ["celery", "-A", "contabil_agente.tarefas", "worker", "-Q", "documentos", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A contabil_agente.tarefas inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Gateway com TLS para os usuários (443) e mTLS para serviços e agentes (8443). Certificados em ./certs
  # (para desenvolvimento: python -c "from agente_v2.mtls import emitir_certificados_dev as e; e('certs')").
  nginx:
    image: nginx:1.27-alpine
    profiles: ["gateway"]
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
      - ./certs:/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  # Observabilidade: Prometheus lê /metrics da API, avalia os alertas de observabilidade/alertas.yml e os entrega ao Alertmanager;
  # o Grafana já sobe com o painel "Sovereign Accounting Agent". Tudo escuta só em 127.0.0.1.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observabilidade"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observabilidade"]
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrada.sh"]
    environment:
      ALERTA_WEBHOOK_URL: ${ALERTA_WEBHOOK_URL:-}
    volumes:
      - ./observabilidade/alertmanager.yml.modelo:/etc/alertmanager/alertmanager.yml.modelo:ro
      - ./observabilidade/entrada.sh:/etc/alertmanager/entrada.sh:ro
      - alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observabilidade"]
    # Sem GRAFANA_ADMIN_PASSWORD o contêiner se recusa a subir (o padrão admin/admin do Grafana nunca é usado).
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'defina GRAFANA_ADMIN_PASSWORD no .env' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observabilidade/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observabilidade/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Vault em modo desenvolvimento: dados em memória, token raiz fixo. NUNCA use assim em produção.
  vault:
    image: hashicorp/vault:1.17
    profiles: ["dev"]
    cap_add:
      - IPC_LOCK
    environment:
      # O compose interpola o arquivo todo, até serviços de perfis desligados: por isso a variável não pode ser obrigatória
      # aqui (senão nada sobe sem ela). Vazia, o Vault em modo dev gera um token aleatório e o mostra no log.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"

volumes:
  dados:
  redis:
  prometheus:
  alertmanager:
  grafana:
