[pytest]
# Configuração Pytest - Sistema Maria Helena
# ==========================================

# Diretórios de testes
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de execução
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# asyncio_default_fixture_loop_scope = function  # removed: may be provided by pytest-asyncio plugin

# Markers customizados
markers =
    unit: Testes unitários isolados
    integration: Testes de integração
    security: Testes da camada de segurança
    asyncio: Marca para testes assíncronos (pytest-asyncio compatibility)
    slow: Testes que demoram mais de 1 segundo
    
# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignores
norecursedirs = .git .tox dist build *.egg venv htmlcov

# Timeouts (managed by pytest-timeout plugin if installed)
# timeout = 300
# timeout_method = thread

# Suppress known external deprecation from pytest-asyncio on Python 3.14
filterwarnings =
    ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning
    ignore:.*Valid config keys have changed in V2.*:UserWarning
    # Suppress groq/pydantic compatibility warning on Python 3.14
    ignore:.*Pydantic V1 functionality.*:UserWarning:groq._compat
    # Suppress pep8/pycodestyle FutureWarning about nested character classes
    ignore:.*Possible nested set at position 1.*:FutureWarning:pep8
