[flake8]
max-line-length = 200
exclude = .git,__pycache__,.venv,venv,build,dist,*.egg-info
ignore = E203,W503
per-file-ignores =
    # nos testes, fixtures importadas de outro módulo aparecem como "redefinidas" nos argumentos
    agente_v2/tests/*.py: F401,F811
    contabil_agente/tests/*.py: F401,F811
