[coverage:run]
source = contabil_agente
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[mypy]
python_version = 3.14
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
ignore_missing_imports = True

[flake8]
max-line-length = 200
exclude = 
    .git,
    __pycache__,
    venv,
    venv_new,
    .venv,
    *.md,
    scripts,
    *.egg-info,
    build,
    dist
ignore = E203, W503
per-file-ignores =
    contabil_agente/EXEMPLO_INTEGRACAO_APP.py: F821, E402
    contabil_agente/GUIA_INTEGRACAO_JOBS.py: F821, E402
    contabil_agente/core/prompts.py: E501
    contabil_agente/core/prompts_backup.py: E501
    contabil_agente/routes/chat.py: E501
    contabil_agente/routes/chat_refactored.py: E501
    contabil_agente/services/response_templates.py: E501
    contabil_agente/atualizar_tabelas_oficiais.py: E501
    contabil_agente/teste_scraping_real.py: E501
    contabil_agente/teste_scraping_v2.py: E501
    LIMPAR_E_RODAR.py: E501
    TESTES_REFACTORING.py: E501
    tools/test_confirm_flow.py: E501
    tools/send_test_post.py: E501
     contabil_agente/middleware/rate_limiter.py: E501
     contabil_agente/orchestrator/dispatcher.py: E501
     contabil_agente/services/document_service.py: E501
     contabil_agente/services/ingestao_service.py: E501
    contabil_agente/tools/send_test_post.py: E501
    contabil_agente/criar_base_dp.py: E501

[isort]
profile = black
line_length = 100
