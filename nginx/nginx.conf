# Gateway: TLS para usuários (443) e TLS mútuo (mTLS) para serviços e agentes (8443).
# A identidade de quem chama continua sendo o token JWT da API: o certificado de cliente autentica o
# canal, não substitui o login. Nenhum cabeçalho de identidade vindo do cliente é repassado.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=geral:10m rate=30r/s;

upstream api {
    server api:8000;
    keepalive 16;
}

map $http_upgrade $conexao { default upgrade; "" close; }

# ---------------------------------------------------------------- usuários (TLS)
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/servidor.pem;
    ssl_certificate_key /certs/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 26m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # métricas só pela porta de serviços (mTLS) ou direto na rede interna; nunca para o público
    location = /metrics {
        return 404;
    }
    location = /token {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location / {
        limit_req zone=geral burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
}

# ------------------------------------------------- serviços e agentes (mTLS obrigatório)
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate         /certs/servidor.pem;
    ssl_certificate_key     /certs/servidor.key;
    ssl_client_certificate  /certs/ca.pem;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    client_max_body_size 26m;

    location / {
        limit_req zone=geral burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
}
