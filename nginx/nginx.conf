user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    upstream backend_upstream {
        # Ajuste este endpoint para o nome/porta do seu serviço backend quando em Docker
        # Em produção Kubernetes use: server <service-name>.<namespace>.svc.cluster.local:5000;
        server 127.0.0.1:5000;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Responder health check direto no Nginx para evitar que regras de
        # autenticação aplicadas no backend bloqueiem o health endpoint.
        location = /api/health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Forward explicit download requests to backend to avoid accidental blocking
        location /download/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }
        # Encaminhar demais requisições para o backend, preservando Authorization
        location / {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
